[project]
name = "mydata"
version = "0.0.1"
description = "myData host: self-hosted personal cloud with a local assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mydata = "mydata.cli:main"
mydatad = "mydata.service.daemon:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mydata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
