name: mydata_ui
description: "myData design system: tokens generated from design/, theme, fonts, logo and shared widgets."
publish_to: none
version: 0.0.1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  # The Mac shell's window (lib/src/mac/mac_window.dart); exact, as its Runner side is copied into each app.
  macos_window_utils: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mydata_testing: ^0.0.1
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    # The theme files of design/themes (the phase 3 looks), copied by tool/generate_tokens.dart.
    - assets/themes/
    # The four apps' icons, for an alert's icon (MyDataAppIcons); rendered by design/assets/Logos/app-icons.
    - assets/app_icons/
    # The theme fonts loaded on demand (lib/src/theme/fonts.dart): Latin subsets cut by tool/subset_fonts.sh.
    - assets/fonts/catalogue/
    # Every bundled font's and icon set's licence (lib/src/licenses.dart).
    - assets/fonts/OFL-plusjakartasans.txt
    - assets/fonts/OFL-figtree.txt
    - assets/fonts/OFL-jetbrainsmono.txt
    - assets/fonts/OFL-inter.txt
    - assets/fonts/OFL-sora.txt
    - assets/fonts/OFL-manrope.txt
    - assets/fonts/OFL-fraunces.txt
    - assets/fonts/OFL-instrument-sans.txt
    - assets/fonts/OFL-fredoka.txt
    - assets/fonts/OFL-nunito.txt
    - assets/fonts/OFL-literata.txt
    - assets/fonts/ISC-lucide.txt
  # The core fonts, in the weights Kiwi uses (design/README.md, "Type"). Licences: assets/fonts/OFL-*.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
    # The Mac frame's icons: Lucide (ISC, assets/fonts/ISC-lucide.txt), cut down by tool/subset_lucide.sh.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide-subset.ttf
