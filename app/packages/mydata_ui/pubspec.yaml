name: mydata_ui
description: "myData design system: tokens generated from design/, theme, fonts, logo and shared widgets."
publish_to: none
version: 0.0.1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  # The Mac shell's window (lib/src/mac/mac_window.dart); exact, as its Runner side is copied into each app.
  macos_window_utils: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mydata_testing: ^0.0.1
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    # The four apps' icons, for an alert's icon (MyDataAppIcons); rendered by design/assets/Logos/app-icons.
    - assets/app_icons/
    # The theme fonts loaded on demand (lib/src/theme/fonts.dart): Latin subsets cut by tool/subset_fonts.sh.
    - assets/fonts/catalogue/
    # Every bundled font's and icon set's licence (lib/src/licenses.dart).
    - assets/fonts/OFL-plusjakartasans.txt
    - assets/fonts/OFL-figtree.txt
    - assets/fonts/OFL-jetbrainsmono.txt
    - assets/fonts/OFL-inter.txt
    - assets/fonts/OFL-sora.txt
    - assets/fonts/OFL-manrope.txt
    - assets/fonts/OFL-fraunces.txt
    - assets/fonts/OFL-instrument-sans.txt
    - assets/fonts/OFL-fredoka.txt
    - assets/fonts/OFL-nunito.txt
    - assets/fonts/OFL-literata.txt
    - assets/fonts/OFL-atkinson-hyperlegible-next.txt
    - assets/fonts/OFL-atkinson-hyperlegible-mono.txt
    - assets/fonts/OFL-kalam.txt
    - assets/fonts/OFL-newsreader.txt
    - assets/fonts/ISC-lucide.txt
    - assets/fonts/MIT-tabler.txt
    - assets/fonts/MIT-phosphor.txt
    - assets/fonts/Apache-material-symbols.txt
  # The core fonts, in the weights Kiwi uses (design/README.md, "Type"). Licences: assets/fonts/OFL-*.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        # Cut by tool/subset_fonts.sh (CORE), for Terminal's titles.
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
    # The icon sets, one font per weight, cut to the semantic ids by tool/subset_icons.sh
    # (lib/src/theme/icon_sets.g.dart): Lucide (ISC; also System's icons on macOS), Tabler Icons (MIT),
    # Phosphor (MIT) and Material Symbols Outlined and Rounded (Apache-2.0). Licences: assets/fonts/ISC-lucide.txt,
    # MIT-tabler.txt, MIT-phosphor.txt, Apache-material-symbols.txt.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide-subset.ttf
    - family: TablerThin
      fonts:
        - asset: assets/fonts/TablerThin-subset.ttf
    - family: TablerLight
      fonts:
        - asset: assets/fonts/TablerLight-subset.ttf
    - family: Tabler
      fonts:
        - asset: assets/fonts/Tabler-subset.ttf
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/PhosphorLight-subset.ttf
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-subset.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/PhosphorBold-subset.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/PhosphorFill-subset.ttf
    - family: MaterialOutlinedLight
      fonts:
        - asset: assets/fonts/MaterialOutlinedLight-subset.ttf
    - family: MaterialOutlined
      fonts:
        - asset: assets/fonts/MaterialOutlined-subset.ttf
    - family: MaterialOutlinedBold
      fonts:
        - asset: assets/fonts/MaterialOutlinedBold-subset.ttf
    - family: MaterialOutlinedFill
      fonts:
        - asset: assets/fonts/MaterialOutlinedFill-subset.ttf
    - family: MaterialRoundedLight
      fonts:
        - asset: assets/fonts/MaterialRoundedLight-subset.ttf
    - family: MaterialRounded
      fonts:
        - asset: assets/fonts/MaterialRounded-subset.ttf
    - family: MaterialRoundedBold
      fonts:
        - asset: assets/fonts/MaterialRoundedBold-subset.ttf
    - family: MaterialRoundedFill
      fonts:
        - asset: assets/fonts/MaterialRoundedFill-subset.ttf
