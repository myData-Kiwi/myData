name: mydata
description: "The myData app: sets up the host, shows its status and holds its settings."
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mydata_core: ^0.0.1
  mydata_ui: ^0.0.1
  mydata_client: ^0.1.0
  # 0.6+ moved to cnativeapi FFI bindings that crash the release (AOT) compiler; 0.5.x uses platform channels.
  tray_manager: ">=0.5.3 <0.6.0"
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
