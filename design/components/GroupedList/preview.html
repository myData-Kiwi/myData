<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Figtree:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{height:44px;padding:0 22px;border-radius:var(--radius-control);font:600 15px/1 var(--font-body);border:0;cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent)}
.tonal{background:var(--accent-soft);color:var(--accent)}
.plain{background:transparent;color:var(--accent)}
.danger{background:var(--danger);color:var(--on-danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.tile{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.t-accent{background:var(--accent-soft);color:var(--accent)}.t-ok{background:var(--success-soft);color:var(--success)}
.t-warn{background:var(--warning-soft);color:var(--warning)}.t-info{background:var(--info-soft);color:var(--info)}
.chipst{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--radius-pill);font:600 13px/1 var(--font-body);white-space:nowrap}
.cap{font-size:13px;line-height:18px;color:var(--ink-muted)}
.g{max-width:560px;overflow:hidden}
.lbl{font:600 13px/18px var(--font-body);color:var(--ink-muted);margin:0 0 8px 6px}
.r{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 16px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}.r.sel{background:var(--accent-soft)}
.r .txt{flex:1;min-width:0}.t{font-weight:600;display:block}
.end{display:flex;align-items:center;gap:8px}
</style></head><body>
<p class="lbl">Sync</p>
<div class="card g">
<div class="r"><span class="tile t-accent"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 8l8 6 8-6"></path></svg></span><span class="txt"><span class="t">Mail</span><span class="cap">2 accounts</span></span><span class="end"><span class="chipst" style="background:var(--success-soft);color:var(--success)">Up to date</span></span></div>
<div class="r sel"><span class="tile t-info"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span><span class="txt"><span class="t">Calendar</span><span class="cap">3 calendars</span></span><span class="end"><span class="chipst" style="background:var(--success-soft);color:var(--success)">Up to date</span></span></div>
<div class="r"><span class="tile t-warn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4 4 3 3-2 4 3"></path></svg></span><span class="txt"><span class="t">Photos</span><span class="cap">Indexing, example 64%</span></span><span class="end"><span class="chipst" style="background:var(--warning-soft);color:var(--warning)">In progress</span></span></div>
<div class="r"><span class="tile t-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></span><span class="txt"><span class="t">Example phone</span><span class="cap">Seen 5 minutes ago</span></span><span class="end"><span class="chipst" style="background:var(--info-soft);color:var(--info)">Connected</span></span></div>
</div>
</body></html>
