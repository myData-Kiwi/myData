<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Figtree:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{height:44px;padding:0 22px;border-radius:var(--radius-control);font:600 15px/1 var(--font-body);border:0;cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent)}
.tonal{background:var(--accent-soft);color:var(--accent)}
.plain{background:transparent;color:var(--accent)}
.danger{background:var(--danger);color:var(--on-danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.tile{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.t-accent{background:var(--accent-soft);color:var(--accent)}.t-ok{background:var(--success-soft);color:var(--success)}
.t-warn{background:var(--warning-soft);color:var(--warning)}.t-info{background:var(--info-soft);color:var(--info)}
.chipst{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--radius-pill);font:600 13px/1 var(--font-body);white-space:nowrap}
.cap{font-size:13px;line-height:18px;color:var(--ink-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:760px}
.card{padding:20px;display:flex;flex-direction:column;gap:12px}
.big{font:700 30px/36px var(--font-display);letter-spacing:-0.02em}
.hd{display:flex;gap:12px;align-items:center;font-weight:600}
.track{height:8px;border-radius:999px;background:var(--surface-sunken)}.fill{height:8px;border-radius:999px;background:var(--accent);width:40%}
</style></head><body>
<div class="grid">
<section class="card"><div class="hd"><span class="tile t-accent"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="8" ry="3"></ellipse><path d="M4 6.5v11c0 1.7 3.6 3 8 3s8-1.3 8-3v-11M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span>Storage</div><div class="big">412 GB</div><div class="track"><div class="fill"></div></div><div class="cap">Example: of 1 TB on Home drive</div></section>
<section class="card"><div class="hd"><span class="tile t-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4 4 3 3-2 4 3"></path></svg></span>Photos</div><div class="big">18,240</div><div class="cap">Example count. 126 added this week.</div><div><button class="btn tonal" type="button">Open myPhotos</button></div></section>
<section class="card"><div class="hd"><span class="tile t-info"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></span>Devices</div><div class="big">3</div><div class="cap">Example. All seen today.</div><div><button class="btn tonal" type="button">Add a device</button></div></section>
</div>
</body></html>
