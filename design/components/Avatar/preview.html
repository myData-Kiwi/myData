<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Figtree:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{height:44px;padding:0 22px;border-radius:var(--radius-control);font:600 15px/1 var(--font-body);border:0;cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent)}
.tonal{background:var(--accent-soft);color:var(--accent)}
.plain{background:transparent;color:var(--accent)}
.danger{background:var(--danger);color:var(--on-danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.tile{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.t-accent{background:var(--accent-soft);color:var(--accent)}.t-ok{background:var(--success-soft);color:var(--success)}
.t-warn{background:var(--warning-soft);color:var(--warning)}.t-info{background:var(--info-soft);color:var(--info)}
.chipst{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:var(--radius-pill);font:600 13px/1 var(--font-body);white-space:nowrap}
.cap{font-size:13px;line-height:18px;color:var(--ink-muted)}
.g{max-width:560px;overflow:hidden}
.lbl{font:600 13px/18px var(--font-body);color:var(--ink-muted);margin:0 0 8px 8px}
.r{display:flex;gap:12px;align-items:center;min-height:56px;box-sizing:border-box;padding:8px 16px;border-top:1px solid var(--line)}
.g>:first-child{border-top:0}
.r .txt{flex:1;min-width:0}.t{font-weight:600;display:block}
.sec{margin-bottom:24px}

.av{width:36px;height:36px;border-radius:var(--radius-pill);background:var(--kiwi-wash);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font:600 15px/22px var(--font-body)}
.av.xl{width:96px;height:96px;font:700 30px/36px var(--font-display);letter-spacing:-0.02em}
.av svg{width:20px;height:20px;fill:none;stroke:var(--ink-muted);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.av.xl svg{width:40px;height:40px}
.av svg.photo{width:100%;height:100%;stroke:none}
.photo .p-bg{fill:var(--cream)}.photo .p-fg{fill:var(--skin)}

.set{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:24px}
.set figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;text-align:center}
</style></head><body>
<div class="set">
<figure><span class="av xl"><svg class="photo" viewBox="0 0 96 96" role="img" aria-label="Ava Fictional"><rect class="p-bg" width="96" height="96"></rect><circle class="p-fg" cx="48" cy="38" r="17"></circle><path class="p-fg" d="M14 96c3-20 17-31 34-31s31 11 34 31z"></path></svg></span><figcaption class="cap">Photo</figcaption></figure>
<figure><span class="av xl" role="img" aria-label="Sam Sample">SS</span><figcaption class="cap">Initials</figcaption></figure>
<figure><span class="av xl" role="img" aria-label="Example Labs">EL</span><figcaption class="cap">Organisation</figcaption></figure>
<figure><span class="av xl" role="img" aria-label="+44 7700 900456"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"></path></svg></span><figcaption class="cap">No letters</figcaption></figure>
</div>
<div class="set">
<figure><span class="av" role="img" aria-label="Ava Fictional"><svg class="photo" viewBox="0 0 96 96" aria-hidden="true"><rect class="p-bg" width="96" height="96"></rect><circle class="p-fg" cx="48" cy="38" r="17"></circle><path class="p-fg" d="M14 96c3-20 17-31 34-31s31 11 34 31z"></path></svg></span><figcaption class="cap">Photo, 36px</figcaption></figure>
<figure><span class="av" role="img" aria-label="Sam Sample">SS</span><figcaption class="cap">Initials, 36px</figcaption></figure>
<figure><span class="av" role="img" aria-label="Example Labs">EL</span><figcaption class="cap">Organisation, 36px</figcaption></figure>
<figure><span class="av" role="img" aria-label="+44 7700 900456"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"></path></svg></span><figcaption class="cap">No letters, 36px</figcaption></figure>
</div>
</body></html>
