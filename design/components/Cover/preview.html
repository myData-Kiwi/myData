<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Figtree:wght@400&display=swap">
<style>
body{margin:0;background:var(--bg)}
.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
svg{position:absolute;left:0;top:0}
.accent{fill:var(--accent)}.ink{fill:var(--ink)}.mute{fill:var(--line-strong)}.brand{fill:var(--brand)}.ground{fill:var(--bg)}.on{fill:var(--on-accent)}
.text{position:absolute;left:40px;bottom:36px;max-width:440px}
.name{margin:0;font:700 104px/0.95 var(--font-display);letter-spacing:-0.04em;color:var(--ink)}
.tag{margin:16px 0 0;font:400 14px/20px var(--font-body);color:var(--ink-muted)}
</style></head><body>
<div class="cover">
<!--
blocks: accent pill 304x72, ink pill 420x72 bleeding right, line-strong pill 240x72, brand disc r36
arrangement: a staggered stack of three pills on a space-2 gap, offset by space-16, with the brand disc as a satellite
pattern: soft and friendly row, discs set into the pills like switch thumbs (r28, half a pill less space-2), because the system is pills, switches and rounded tiles
scales: pill radius is half the 72px height, space-2 gaps, space-16 stagger, thumb inset space-2
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<rect class="accent" x="496" y="28" width="304" height="72" rx="36"></rect>
<circle class="on" cx="764" cy="64" r="28"></circle>
<rect class="ink" x="560" y="108" width="440" height="72" rx="36"></rect>
<circle class="ground" cx="596" cy="144" r="28"></circle>
<rect class="mute" x="496" y="188" width="240" height="72" rx="36"></rect>
<circle class="ground" cx="700" cy="224" r="28"></circle>
<circle class="brand" cx="800" cy="224" r="36"></circle>
</svg>
<div class="text"><h1 class="name">myData</h1><p class="tag">Your data, kept at home.</p></div>
</div>
</body></html>
