[project]
name = "mydata"
version = "0.0.1"
description = "myData host: self-hosted personal cloud with a local assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mydata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
